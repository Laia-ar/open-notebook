# Fork instance — runs alongside an upstream Open Notebook deployment on the
# same host. It is a self-contained compose project (own name, own volumes,
# own ports), built from this repo's source instead of the published image.
#
# Deploys are driven by scripts/deploy-fork.sh (git pull + rebuild).
#
# Ports can be overridden in a local .env next to this file:
#   FORK_WEB_PORT=8503   FORK_API_PORT=5056   FORK_DB_PORT=8001
name: open-notebook-fork

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/mydatabase.db"]
    user: root  # Required for bind mounts on Linux
    ports:
      # Localhost only, and shifted off the upstream instance's 8000. Purely
      # for local debugging; the app reaches it over the internal network.
      - "127.0.0.1:${FORK_DB_PORT:-8001}:8000"
    volumes:
      - surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always

  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FORK_WEB_PORT:-8503}:8502"  # Web UI
      - "${FORK_API_PORT:-5056}:5055"  # REST API (optional externally; the UI proxies to it internally)
    environment:
      # REQUIRED: set in .env — encrypts API keys stored in the database.
      # Use a different value than the upstream instance.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?Set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}

      # Database connection (internal network; port remapping above does not
      # affect this URL).
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # Password-protect this instance (auth is fully disabled when unset).
      # Strongly recommended: this instance is reachable on a public IP.
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-}

      # REQUIRED: public URL of THIS instance's API. The frontend's
      # auto-detection (frontend/src/app/config/route.ts) hardcodes port
      # 5055, which on this shared host is the upstream instance — without
      # this override the fork UI silently talks to the upstream API.
      - API_URL=${API_URL:-https://64-176-11-56.nip.io}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://64-176-11-56.nip.io}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-PEGA_ACA_TU_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-PEGA_ACA_TU_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://64-176-11-56.nip.io/api/auth/google/callback}
      - OPEN_NOTEBOOK_FRONTEND_URL=${OPEN_NOTEBOOK_FRONTEND_URL:-https://64-176-11-56.nip.io}
      - OPEN_NOTEBOOK_COOKIE_SECURE=${OPEN_NOTEBOOK_COOKIE_SECURE:-true}
    volumes:
      - notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - open_notebook
    restart: always

volumes:
  surreal_data:
  notebook_data:
  caddy_data:
  caddy_config:
